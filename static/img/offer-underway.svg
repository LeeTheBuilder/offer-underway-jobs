<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200" role="img" aria-labelledby="title">
  <title id="title">Offer Underway — find your next role</title>
  <rect width="600" height="200" rx="32" fill="#ffffff"/>
  <svg x="48" y="42" width="504" height="86.4" viewBox="0 0 560 96">
  <title id="ou-wordmark-title">OFFER Underway</title>
  <desc id="ou-wordmark-desc">Offer Underway brand lockup with the teal upward path icon and bold black wordmark.</desc>
  <defs>
    <linearGradient id="ou-wordmark-bg" x1="12" y1="12" x2="84" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="ou-wordmark-shine" x1="48" y1="12" x2="48" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="12" y="12" width="72" height="72" rx="16" fill="url(#ou-wordmark-bg)"/>
  <rect x="12" y="12" width="72" height="72" rx="16" fill="url(#ou-wordmark-shine)"/>

  <g fill="none" stroke="#F7F7F0" stroke-linecap="round" stroke-linejoin="round" transform="translate(12 12) scale(0.5625)">
    <path d="M 32 94 Q 58 92 72 68 T 98 32" stroke-width="16"/>
    <path d="M 76 30 L 98 30 L 98 52" stroke-width="16"/>
  </g>
  <circle cx="30" cy="64.875" r="4.5" fill="#F7F7F0"/>

  <text
    x="108"
    y="65"
    fill="#000000"
    font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="48"
    font-weight="700"
    letter-spacing="-1.2"
  >OFFER Underway</text>
</svg>
  <text x="300" y="158" text-anchor="middle" fill="#40554e" font-family="Arial, Helvetica, sans-serif" font-size="18">Find roles. Prepare applications. Track progress.</text>
</svg>
